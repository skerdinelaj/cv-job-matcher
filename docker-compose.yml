# For now only the database. We add the `api` (Step 1) and `web` (Step 8)
# services when those apps exist.
services:
  db:
    # Postgres 16 with the pgvector extension already installed
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobmatch}
      POSTGRES_DB: ${POSTGRES_DB:-jobmatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives `docker compose down` (but not `down -v`)
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobmatch} -d ${POSTGRES_DB:-jobmatch}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
