<!-- Thin bar at the very top while any HTTP request is running (loadingInterceptor) -->
@if (loading.isLoading()) {
  <div class="loading-bar" role="progressbar" aria-label="Loading"></div>
}

<header class="topbar">
  <h1>JobMatch</h1>

  <nav class="nav">
    @for (item of navItems; track item.path) {
      <!-- routerLink = client-side navigation (no page reload), like <Link to> in React Router.
           routerLinkActive adds the class when this link's route is the current one. -->
      <a class="nav__link" [routerLink]="item.path" routerLinkActive="nav__link--active">
        {{ item.label }}
      </a>
    }
  </nav>

  <app-api-status class="topbar__status" />
</header>

<!-- Error banner: filled by the error interceptor and the global error handler -->
@if (errors.message(); as message) {
  <div class="error-banner" role="alert">
    <span>{{ message }}</span>
    <button type="button" class="error-banner__close" (click)="errors.clear()">Dismiss</button>
  </div>
}

<main class="content">
  <!-- The page for the current URL renders here -->
  <router-outlet />
</main>
